<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — LuckyCup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<style>
  :root {
    --accent:       #c94f2b;
    --accent-light: #faeee9;
    --accent-dark:  #993c1d;
    --bg:           #f7f4f0;
    --surface:      #ffffff;
    --surface2:     #f0ece6;
    --border:       rgba(0,0,0,0.08);
    --border-mid:   rgba(0,0,0,0.13);
    --text:         #1a1a1a;
    --muted:        #888;
    --muted2:       #bbb;
    --green:        #2a9d5c;
    --green-light:  #E1F5EE;
    --red:          #c0392b;
    --red-light:    #fdedea;
    --amber:        #b8860b;
    --amber-light:  #fcf5e3;
    --font:         'IBM Plex Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .page-sub { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; margin-bottom: 36px; }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border-mid);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  /* ── Login gate ── */
  .gate { max-width: 400px; margin: 80px auto 0; }
  .gate h2 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .gate p { font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  label { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border-mid);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); background: var(--surface); }

  .btn {
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 7px 14px; font-size: 10px; letter-spacing: 1px; }
  .btn-green { background: var(--green); }
  .btn-red   { background: var(--red); }
  .btn-ghost {
    background: transparent;
    border: 0.5px solid var(--border-mid);
    color: var(--muted);
  }

  .msg { font-size: 12px; padding: 10px 14px; border-radius: 6px; border: 1px solid; margin-bottom: 14px; }
  .msg.error { border-color: #f5c4b3; color: var(--accent-dark); background: var(--accent-light); }

  /* ── Stats overview ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 0.5px solid var(--border-mid);
    border-radius: 10px;
    padding: 18px;
  }
  .stat-icon { font-size: 18px; color: var(--accent); margin-bottom: 10px; display: block; }
  .stat-val  { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-lbl  { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px; }

  /* ── Section headers ── */
  .sect-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    margin-top: 36px;
  }
  .sect-head h2 { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .count-badge {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 20px;
    background: var(--accent-light);
    color: var(--accent-dark);
    font-weight: 500;
  }

  /* ── Cafe rows ── */
  .cafe-row {
    background: var(--surface);
    border: 0.5px solid var(--border-mid);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .cafe-swatch {
    width: 42px; height: 42px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: var(--surface2);
    overflow: hidden;
  }
  .cafe-swatch img { width: 100%; height: 100%; object-fit: cover; }
  .cafe-info { min-width: 160px; }
  .cafe-name { font-size: 14px; font-weight: 700; }
  .cafe-slug { font-size: 11px; color: var(--muted2); margin-top: 2px; }
  .cafe-email { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .cafe-metrics {
    display: flex;
    gap: 22px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .metric { text-align: center; min-width: 56px; }
  .metric-val { font-size: 17px; font-weight: 700; }
  .metric-lbl { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  .status-pill {
    font-size: 10px;
    padding: 3px 11px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .status-pill.approved { background: var(--green-light); color: var(--green); }
  .status-pill.pending  { background: var(--amber-light); color: var(--amber); }
  .status-pill.rejected { background: var(--red-light);   color: var(--red); }

  .cafe-actions { display: flex; gap: 8px; }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--muted2);
    font-size: 13px;
    border: 1px dashed var(--border-mid);
    border-radius: 10px;
  }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; }
  .refresh-btn {
    background: transparent;
    border: 0.5px solid var(--border-mid);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (max-width: 800px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .cafe-metrics { margin-left: 0; width: 100%; justify-content: flex-start; }
    .cafe-actions { width: 100%; }
    .cafe-actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="logo">Lucky<span>Cup</span></div>
      <div class="page-sub">Admin Dashboard</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadDashboard()" style="display:none">↻ Refresh</button>
  </div>

  <!-- ── LOGIN GATE ── -->
  <div class="gate" id="gate">
    <div class="card">
      <h2>Admin Access</h2>
      <p>Enter the master key to view the dashboard. The key is never stored in the browser.</p>
      <div class="msg error" id="gateErr" style="display:none"></div>
      <label>Master Key</label>
      <input type="password" id="masterKeyInput" placeholder="••••••••"
             onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn btn-block" id="unlockBtn" onclick="unlock()">Unlock →</button>
    </div>
  </div>

  <!-- ── DASHBOARD ── -->
  <div id="dashboard" style="display:none">

    <div class="loading" id="dashLoading">Loading...</div>

    <div id="dashContent" style="display:none">

      <!-- Stats overview -->
      <div class="stats-grid">
        <div class="stat-card">
          <i class="ti ti-building-store stat-icon" aria-hidden="true"></i>
          <div class="stat-val" id="statCafes">0</div>
          <div class="stat-lbl">Cafes live</div>
        </div>
        <div class="stat-card">
          <i class="ti ti-clock stat-icon" aria-hidden="true"></i>
          <div class="stat-val" id="statPending">0</div>
          <div class="stat-lbl">Pending</div>
        </div>
        <div class="stat-card">
          <i class="ti ti-users stat-icon" aria-hidden="true"></i>
          <div class="stat-val" id="statMembers">0</div>
          <div class="stat-lbl">Members</div>
        </div>
        <div class="stat-card">
          <i class="ti ti-stamp stat-icon" aria-hidden="true"></i>
          <div class="stat-val" id="statStamps">0</div>
          <div class="stat-lbl">Total stamps</div>
        </div>
        <div class="stat-card">
          <i class="ti ti-coffee stat-icon" aria-hidden="true"></i>
          <div class="stat-val" id="statRedemptions">0</div>
          <div class="stat-lbl">Free coffees</div>
        </div>
      </div>

      <!-- Pending requests -->
      <div class="sect-head">
        <h2>Pending Requests</h2>
        <span class="count-badge" id="pendingCount">0</span>
      </div>
      <div id="pendingList"></div>

      <!-- Approved cafes -->
      <div class="sect-head">
        <h2>Live Cafes</h2>
        <span class="count-badge" id="approvedCount">0</span>
      </div>
      <div id="approvedList"></div>

      <!-- Rejected -->
      <div class="sect-head" id="rejectedHead" style="display:none">
        <h2>Rejected</h2>
        <span class="count-badge" id="rejectedCount">0</span>
      </div>
      <div id="rejectedList"></div>

    </div>
  </div>

</div>

<script src="/config.js"></script>
<script>
let masterKey = null;

async function unlock() {
  const key = document.getElementById('masterKeyInput').value.trim();
  if (!key) return showGateErr('Enter the master key.');

  const btn = document.getElementById('unlockBtn');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    // Verify by attempting a list call
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin-list-cafes', masterKey: key }),
    });
    const data = await res.json();
    if (!data.ok) return showGateErr(data.error || 'Wrong key.');

    masterKey = key;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = '';
    document.getElementById('refreshBtn').style.display = '';
    renderDashboard(data.cafes);
  } catch (e) {
    showGateErr('Network error — try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Unlock →';
  }
}

function showGateErr(msg) {
  const el = document.getElementById('gateErr');
  el.textContent = msg;
  el.style.display = '';
}

async function loadDashboard() {
  document.getElementById('dashLoading').style.display = '';
  document.getElementById('dashContent').style.display = 'none';
  try {
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin-list-cafes', masterKey }),
    });
    const data = await res.json();
    if (data.ok) renderDashboard(data.cafes);
  } catch (e) { /* keep current view */ }
}

function renderDashboard(cafes) {
  document.getElementById('dashLoading').style.display = 'none';
  document.getElementById('dashContent').style.display = '';

  const pending  = cafes.filter(c => c.status === 'pending');
  const approved = cafes.filter(c => c.status === 'approved');
  const rejected = cafes.filter(c => c.status === 'rejected');

  // Overview stats (approved cafes only for member/stamp metrics)
  let members = 0, stamps = 0, redemptions = 0;
  for (const c of approved) {
    members     += c.stats.members;
    stamps      += c.stats.totalStamps;
    redemptions += c.stats.redemptions;
  }
  document.getElementById('statCafes').textContent       = approved.length;
  document.getElementById('statPending').textContent     = pending.length;
  document.getElementById('statMembers').textContent     = members;
  document.getElementById('statStamps').textContent      = stamps;
  document.getElementById('statRedemptions').textContent = redemptions;

  document.getElementById('pendingCount').textContent  = pending.length;
  document.getElementById('approvedCount').textContent = approved.length;

  renderList('pendingList', pending, true);
  renderList('approvedList', approved, false);

  const rh = document.getElementById('rejectedHead');
  if (rejected.length) {
    rh.style.display = '';
    document.getElementById('rejectedCount').textContent = rejected.length;
    renderList('rejectedList', rejected, false, true);
  } else {
    rh.style.display = 'none';
    document.getElementById('rejectedList').innerHTML = '';
  }
}

function renderList(containerId, cafes, isPending, isRejected = false) {
  const el = document.getElementById(containerId);
  if (!cafes.length) {
    el.innerHTML = `<div class="empty-state">${isPending ? 'No pending requests' : 'Nothing here yet'}</div>`;
    return;
  }

  el.innerHTML = cafes.map(c => {
    const swatch = c.logo_url
      ? `<div class="cafe-swatch"><img src="${esc(c.logo_url)}" alt=""></div>`
      : `<div class="cafe-swatch" style="background:${esc(c.accent)}22">${esc(c.stamp || '☕')}</div>`;

    const metrics = `
      <div class="cafe-metrics">
        <div class="metric"><div class="metric-val">${c.stats.members}</div><div class="metric-lbl">Members</div></div>
        <div class="metric"><div class="metric-val">${c.stats.totalStamps}</div><div class="metric-lbl">Stamps</div></div>
        <div class="metric"><div class="metric-val">${c.stats.redemptions}</div><div class="metric-lbl">Redeemed</div></div>
      </div>`;

    const actions = isPending
      ? `<div class="cafe-actions">
           <button class="btn btn-sm btn-green" onclick="setStatus('${esc(c.slug)}','approved')">Approve ✓</button>
           <button class="btn btn-sm btn-red"   onclick="setStatus('${esc(c.slug)}','rejected')">Reject</button>
         </div>`
      : isRejected
        ? `<div class="cafe-actions">
             <button class="btn btn-sm btn-green" onclick="setStatus('${esc(c.slug)}','approved')">Approve ✓</button>
           </div>`
        : `<div class="cafe-actions">
             <span class="status-pill approved">live</span>
           </div>`;

    return `
      <div class="cafe-row">
        ${swatch}
        <div class="cafe-info">
          <div class="cafe-name">${esc(c.cafe_name)}</div>
          <div class="cafe-slug">${esc(c.slug)} · ${new Date(c.created_at).toLocaleDateString()}</div>
          ${c.contact_email ? `<div class="cafe-email">${esc(c.contact_email)}</div>` : ''}
        </div>
        ${metrics}
        ${actions}
      </div>`;
  }).join('');
}

async function setStatus(slug, status) {
  try {
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin-set-status', masterKey, cafeSlug: slug, status }),
    });
    const data = await res.json();
    if (!data.ok) { alert(data.error || 'Failed'); return; }
    loadDashboard();
  } catch (e) {
    alert('Network error — try again.');
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[m]);
}
</script>
</body>
</html>
